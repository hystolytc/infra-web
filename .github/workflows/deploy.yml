name: Build and Deploy

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "release:*"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - main
          - staging
      confirm_deployment:
        description: 'Confirm the deployment'
        required: true
        type: boolean
        default: false

jobs:
  setup-env:
    name: Setup environment based on trigger
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.set-env.outputs.deploy_env }}
      deploy_version: ${{ steps.set-env.outputs.deploy_version }}
    steps:
      - name: Validate deployment confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.confirm_deployment }}" != "true" ]]; then
            echo "::error::Deployment confirmation not received. Please confirm the deployment before proceeding."
            exit 1
          fi
      
      - name: Set deployment environment
        id: set-env
        run: |
          DEPLOY_ENV="${{ github.event.inputs.environment }}"
          DEPLOY_VERSION="staging"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/release/* ]]; then
            DEPLOY_VERSION=$(echo ${{ github.ref }} | cut -d'/' -f 4 | cut -d'-' -f 2)
          fi

          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "deploy_version=$DEPLOY_VERSION" >> $GITHUB_OUTPUT
          echo "$DEPLOY_ENV"
    
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs:
      - setup-env
    environment: ${{ needs.setup-env.outputs.deploy_env }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      NEXT_PUBLIC_AUTHOR_NAME: ${{ vars.NEXT_PUBLIC_AUTHOR_NAME }}
      NEXT_PUBLIC_ENV: ${{ needs.setup-env.outputs.deploy_env }}
    steps:
      - run: |
          echo "Building for env ${{ needs.setup-env.outputs.deploy_env }}"
      
      - name: Setup Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
      
      - name: Install Dependency
        run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_AUTHOR_NAME=${{ env.NEXT_PUBLIC_AUTHOR_NAME }}
            NEXT_PUBLIC_ENV=${{ env.NEXT_PUBLIC_ENV }}
      
      - name: Set image outputs
        id: set-image
        run: |
          echo "image=${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.set-image.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check for critical vulnerabilities
        run: |
          if grep -q '"level":"error"' trivy-results.sarif; then
            echo "::error::Critical vulnerabilities found in the image"
            exit 1
          fi